name: Release
# Pinned actions (full commit SHA + release tag; Dependabot keeps these current).
#   actions/checkout                       v7.0.1   3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact                v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact              v8.0.2   9000827ccba6bdab643e8b6fd33ac0654aef8333
#   dtolnay/rust-toolchain                 master   683b588c487a69d01f6c6ddf40f036ff682cc2c8 (toolchain via `with:`)
#   Swatinem/rust-cache                    v2.9.3   d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   taiki-e/install-action                 v2.87.29 8cca0918f8471c33515202b73f56ab27f2bed283
#   amannn/action-semantic-pull-request    v6.1.1   48f256284bd46cdaab1048c3721360e808335d50
# git-cliff v2.14.2 (installed via taiki-e/install-action, version pinned in `tool:`).
# No other third-party actions: the GitHub Release is created with the preinstalled `gh` CLI.
#
# Flow (push to main):
#   version  -> git-cliff computes the next semver from Conventional Commits since the last v* tag
#               and renders notes; if nothing release-worthy (feat/fix/perf/refactor/breaking) landed,
#               the run ends here with no tag and no release.
#   build    -> one job per target; RUCKCODE_VERSION is baked into `rc --version`; packages
#               rc-<version>-<target>.tar.gz|zip (+ .sha256).
#   publish  -> SHA256SUMS, then `gh release create vX.Y.Z --target <sha>` (this creates the tag,
#               only after every build succeeded). CHANGELOG.md is attached to the release,
#               never committed back to main (no bot commits).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.calc.outputs.release }}
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: git-cliff@2.14.2
      - name: Compute next version and notes
        id: calc
        run: |
          set -euo pipefail
          mkdir -p notes
          release=false
          next="$(git cliff --bumped-version)"   # e.g. v0.2.0 (initial_tag v0.1.0 when no tag exists)
          # Commits that git-cliff does not skip (see cliff.toml); empty => no release-worthy change.
          git cliff --unreleased --tag "$next" --strip all > notes/release-notes.md
          if [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            echo "HEAD is already tagged; nothing to do."
          elif [ ! -s notes/release-notes.md ]; then
            echo "No release-worthy commits since the last tag; skipping release."
          elif git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "Tag $next already exists; skipping."
          else
            release=true
            git cliff --tag "$next" --output notes/CHANGELOG.md
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (release=$release)"
          cat notes/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.calc.outputs.release == 'true'
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          # Apple Silicon runner; the x86_64 build is cross-compiled (Apple clang
          # targets both) so it does not depend on scarce Intel runners.
          - { target: aarch64-apple-darwin,      os: macos-14 }
          - { target: x86_64-apple-darwin,       os: macos-14 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2022 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      RUCKCODE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # aws-lc-sys (rustls crypto via rmcp/reqwest): needs only a C compiler (+ cmake, preinstalled
      # on all runners); musl needs musl-gcc, Windows needs NASM (preinstalled; safety net below).
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Ensure NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p ruckcode-cli --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="rc-${VERSION}-${TARGET}"
          mkdir -p "$name" dist
          exe=rc; [[ "$TARGET" == *windows* ]] && exe=rc.exe
          cp "target/${TARGET}/release/${exe}" LICENSE README.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            archive="${name}.zip"; 7z a -tzip "dist/${archive}" "$name" >/dev/null
          else
            archive="${name}.tar.gz"; tar -czf "dist/${archive}" "$name"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "${archive}.sha256"
          else shasum -a 256 "$archive" > "${archive}.sha256"; fi
          cat "${archive}.sha256"
      - name: Smoke test version string
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe="target/${TARGET}/release/rc"; [[ "$TARGET" == *windows* ]] && exe+=.exe
          out="$("$exe" --version)"; echo "$out"
          [[ "$out" == *"$VERSION"* ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Create tag and GitHub Release
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes/release-notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS notes/CHANGELOG.md
