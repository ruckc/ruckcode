name: Release
# Pinned actions: official GitHub `actions/*` only (full commit SHA + release tag;
# Dependabot keeps these current).
#   actions/checkout           v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/configure-pages    v6.0.0  45bfe0192ca1faeb007ade9deae92b16b8254a0d
#   actions/upload-pages-artifact v5.0.0 fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages       v5.0.1  368f82528645a54fb793d4d04e342629a3f51346
# The repository is private, so Release assets are not publicly downloadable. After the release is
# published, ci.yml's `release-pages` job deploys the LATEST version to GitHub Pages (download page, install.sh,
# updater manifests, all artifacts); that is what users, the desktop updater and `rc self-update`
# fetch from. Updater signing needs the secrets TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) and the
# variable RUCKCODE_UPDATER_PUBKEY (see CONTRIBUTING.md); without them everything still builds, but
# no updater artifacts, signatures or manifests are produced.

# Manual only: redeploy the GitHub Pages site from an existing release (used by release-notes.yml
# after the latest release's notes change). The release itself, including its Pages deploy, is
# part of ci.yml (release-* jobs) so builds run in parallel with the checks.
on:
  workflow_dispatch:
    inputs:
      redeploy_pages:
        description: Redeploy GitHub Pages from an existing release (the only supported action)
        type: boolean
        default: false
      tag:
        description: Release tag to redeploy (default - the latest release)
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Where releases are published; must equal DEFAULT_BASE_URL in crates/ruckcode-cli/src/update.rs
  # and crates/ruckcode-app/src/update.rs (scripts/test_build_site.py checks this).
  UPDATE_BASE_URL: https://ruckc.github.io/ruckcode

jobs:
  # Manual run with "redeploy_pages": rebuild and redeploy the Pages site from an existing release
  # (assets come from the release; signatures were uploaded to it, so no signing secret is needed).
  redeploy-site:
    if: ${{ inputs.redeploy_pages }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBKEY: ${{ vars.RUCKCODE_UPDATER_PUBKEY }}
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName --jq .tagName)"
          tag="${TAG_INPUT:-$latest}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid release tag: $tag"; exit 1; }
          if [ "$tag" != "$latest" ]; then
            echo "::error::$tag is not the latest release ($latest); the Pages site hosts the latest version only."
            exit 1
          fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          mkdir -p dist notes
          gh release download "$tag" --dir dist
          rm -f dist/CHANGELOG.md
          gh release view "$tag" --json body --jq .body > notes/release-notes.md
          ls -l dist
      - name: Build the Pages site
        run: |
          set -euo pipefail
          shopt -s nullglob
          sigs=(dist/*.sig)
          args=(--dist dist --out site-out --version "$VERSION" --base-url "$UPDATE_BASE_URL" --notes notes/release-notes.md)
          if [ -n "$PUBKEY" ] && [ "${#sigs[@]}" -gt 0 ]; then
            args+=(--signed --pubkey "$PUBKEY")
          else
            echo "::warning::No signatures in the release or RUCKCODE_UPDATER_PUBKEY unset: deploying without updater manifests."
          fi
          python3 scripts/build_site.py "${args[@]}"
      - name: Check Pages size limits
        run: scripts/check_site_limits.sh site-out
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out

  # Deploys the site built by redeploy-site (the normal release deploy is release-pages in ci.yml).
  pages:
    needs: redeploy-site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release   # shared with ci.yml's release-publish / release-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
