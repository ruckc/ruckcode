name: Release
# Pinned actions: official GitHub `actions/*` only (full commit SHA + release tag;
# Dependabot keeps these current).
#   actions/checkout           v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/cache (restore/save) v6.1.0 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
#   actions/upload-artifact    v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact  v8.0.2  9000827ccba6bdab643e8b6fd33ac0654aef8333
#   actions/setup-node         v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
# Rust comes from the runner's preinstalled rustup; the GitHub Release is created with `gh`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # Windows runners default to PowerShell, which does not expand "$VAR".
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.calc.outputs.release }}
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install git-cliff
        env:
          CLIFF_VERSION: 2.14.2
          CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
        run: |
          set -euo pipefail
          archive="git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO --retry 3 "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/${archive}"
          echo "${CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive"
          install -D -m 0755 "git-cliff-${CLIFF_VERSION}/git-cliff" "$HOME/.local/bin/git-cliff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compute next version and notes
        id: calc
        run: |
          set -euo pipefail
          mkdir -p notes
          release=false
          next="$(git cliff --bumped-version)"   # e.g. v0.2.0 (initial_tag v0.1.0 when no tag exists)
          # Commits that git-cliff does not skip (see cliff.toml); empty => no release-worthy change.
          git cliff --unreleased --tag "$next" --strip all > notes/release-notes.md
          if [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            echo "HEAD is already tagged; nothing to do."
          elif [ ! -s notes/release-notes.md ]; then
            echo "No release-worthy commits since the last tag; skipping release."
          elif git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "Tag $next already exists; skipping."
          else
            release=true
            git cliff --tag "$next" --output notes/CHANGELOG.md
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (release=$release)"
          cat notes/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.calc.outputs.release == 'true'
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Build every target even if one fails; publish still requires all of them.
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          # Apple Silicon runner; the x86_64 build is cross-compiled (Apple clang
          # targets both) so it does not depend on scarce Intel runners.
          - { target: aarch64-apple-darwin,      os: macos-14 }
          - { target: x86_64-apple-darwin,       os: macos-14 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2022 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      RUCKCODE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}
          rustup default stable
          echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      # aws-lc-sys (rustls crypto via rmcp/reqwest): needs only a C compiler (+ cmake, preinstalled
      # on all runners); musl needs musl-gcc, Windows needs NASM (preinstalled; safety net below).
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Ensure NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
      - name: Restore cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.target }}-${{ runner.os }}-rust${{ env.RUSTC_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ matrix.target }}-${{ runner.os }}-rust${{ env.RUSTC_VERSION }}-
      - name: Build
        run: cargo build --release --locked -p ruckcode-cli --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="rc-${VERSION}-${TARGET}"
          mkdir -p "$name" dist
          exe=rc; [[ "$TARGET" == *windows* ]] && exe=rc.exe
          cp "target/${TARGET}/release/${exe}" LICENSE README.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            archive="${name}.zip"; 7z a -tzip "dist/${archive}" "$name" >/dev/null
          else
            archive="${name}.tar.gz"; tar -czf "dist/${archive}" "$name"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "${archive}.sha256"
          else shasum -a 256 "$archive" > "${archive}.sha256"; fi
          cat "${archive}.sha256"
      - name: Smoke test version string
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe="target/${TARGET}/release/rc"; [[ "$TARGET" == *windows* ]] && exe+=.exe
          out="$("$exe" --version)"; echo "$out"
          [[ "$out" == *"$VERSION"* ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Save cargo cache
        if: always() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.target }}-${{ runner.os }}-rust${{ env.RUSTC_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

  # Desktop app bundles (Tauri v2 CLI from app/ devDependencies; no third-party actions).
  # Linux builds on ubuntu-22.04 on purpose: bundles link against that image's glibc (2.35) and
  # webkit2gtk-4.1, so they run on older distributions than a 24.04 build would. Unsigned unless
  # the optional signing secrets exist (see "Signing" steps and CONTRIBUTING.md).
  app:
    name: app (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bundles: "appimage,deb" }
          - { target: aarch64-apple-darwin,     os: macos-14,     bundles: "app,dmg" }
          - { target: x86_64-apple-darwin,      os: macos-14,     bundles: "app,dmg" }
          - { target: x86_64-pc-windows-msvc,   os: windows-2022, bundles: "msi,nsis" }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      RUCKCODE_VERSION: ${{ needs.version.outputs.version }}
      PNPM_VERSION: "10.28.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup default stable
          echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libfuse2 xdg-utils file patchelf
      - name: Ensure NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Restore cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/ruckcode-app/target
          key: cargo-release-app-${{ matrix.target }}-${{ runner.os }}-rust${{ env.RUSTC_VERSION }}-${{ hashFiles('crates/ruckcode-app/Cargo.lock') }}
          restore-keys: |
            cargo-release-app-${{ matrix.target }}-${{ runner.os }}-rust${{ env.RUSTC_VERSION }}-
      - run: pnpm -C app install --frozen-lockfile

      # Signing is optional: each step only exports credentials when its secrets are set, so
      # forks and unconfigured repositories produce unsigned bundles. Secrets cannot be used in
      # `if:`, hence the env-and-check pattern.
      - name: Signing (macOS, optional)
        if: runner.os == 'macOS'
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$S_APPLE_CERTIFICATE" ] && [ -n "$S_APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$S_APPLE_SIGNING_IDENTITY" ]; then
            echo "Developer ID signing enabled."
            {
              echo "APPLE_CERTIFICATE<<EOF_CERT"; echo "$S_APPLE_CERTIFICATE"; echo "EOF_CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$S_APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$S_APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$S_APPLE_ID" ] && [ -n "$S_APPLE_PASSWORD" ] && [ -n "$S_APPLE_TEAM_ID" ]; then
              echo "Notarization enabled."
              {
                echo "APPLE_ID=$S_APPLE_ID"
                echo "APPLE_PASSWORD=$S_APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$S_APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            else
              echo "Notarization secrets missing; signed but not notarized."
            fi
          else
            echo "No Apple signing secrets; building an unsigned (Gatekeeper-flagged) app."
          fi
      - name: Signing (Windows, optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfx
            $cfg = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
            Set-Content -Path (Join-Path $env:RUNNER_TEMP 'sign.json') -Value $cfg
            "SIGN_CONFIG=$(Join-Path $env:RUNNER_TEMP 'sign.json')" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host 'Authenticode signing enabled.'
          } else {
            Write-Host 'No Windows signing secrets; building unsigned installers (SmartScreen will warn).'
          }

      - name: Build bundles
        run: |
          set -euo pipefail
          # The release version is injected here and never committed: Tauri takes the bundle
          # version from the merged config, RUCKCODE_VERSION feeds the app's reported version.
          extra=()
          if [ -n "${SIGN_CONFIG:-}" ]; then extra+=(--config "$SIGN_CONFIG"); fi
          export NO_STRIP=true   # linuxdeploy's bundled strip chokes on newer ELF sections
          pnpm -C app tauri build --ci --target "$TARGET" --bundles "${{ matrix.bundles }}" \
            --config "{\"version\":\"${VERSION}\"}" ${extra[@]+"${extra[@]}"}
      - name: Collect and checksum
        run: |
          set -euo pipefail
          bundle="crates/ruckcode-app/target/${TARGET}/release/bundle"
          find "$bundle" -maxdepth 2 | sort
          mkdir -p dist
          prefix="ruckcode-app-${VERSION}-${TARGET}"
          case "$TARGET" in
            *apple-darwin)
              cp "$bundle"/dmg/*.dmg "dist/${prefix}.dmg"
              tar -C "$bundle/macos" -czf "dist/${prefix}.app.tar.gz" ruckcode.app ;;
            *windows*)
              cp "$bundle"/msi/*.msi "dist/${prefix}.msi"
              cp "$bundle"/nsis/*-setup.exe "dist/${prefix}-setup.exe" ;;
            *linux*)
              cp "$bundle"/appimage/*.AppImage "dist/${prefix}.AppImage"
              cp "$bundle"/deb/*.deb "dist/${prefix}.deb" ;;
          esac
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "${f}.sha256"
            else shasum -a 256 "$f" > "${f}.sha256"; fi
            cat "${f}.sha256"
          done
      - name: Verify bundle version
        run: |
          set -euo pipefail
          prefix="dist/ruckcode-app-${VERSION}-${TARGET}"
          case "$TARGET" in
            *linux*)
              dpkg-deb -f "${prefix}.deb" Version | grep -qx "$VERSION"
              chmod +x "${prefix}.AppImage"; file "${prefix}.AppImage" ;;
            *apple-darwin)
              tar -xzf "${prefix}.app.tar.gz" -C "$RUNNER_TEMP"
              plist="$RUNNER_TEMP/ruckcode.app/Contents/Info.plist"
              [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION" ]
              # A GUI app has no --version; check the architecture instead. The x86_64 build is
              # cross-compiled on Apple Silicon, so it is never executed here.
              lipo -archs "$RUNNER_TEMP"/ruckcode.app/Contents/MacOS/* ;;
            *windows*)
              test -s "${prefix}.msi"; test -s "${prefix}-setup.exe" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Save cargo cache
        if: always() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/ruckcode-app/target
          key: cargo-release-app-${{ matrix.target }}-${{ runner.os }}-rust${{ env.RUSTC_VERSION }}-${{ hashFiles('crates/ruckcode-app/Cargo.lock') }}
      - name: Save pnpm store
        if: always() && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}

  publish:
    # Any failed app bundle blocks the release so CLI and app versions stay consistent.
    needs: [version, build, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Create tag and GitHub Release
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes/release-notes.md \
            dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.msi dist/*.exe dist/*.AppImage dist/*.deb dist/*.sha256 dist/SHA256SUMS notes/CHANGELOG.md
