name: Conventional Commits
# Pinned actions: official GitHub `actions/*` only (full commit SHA + release tag;
# Dependabot keeps these current).
#   actions/checkout           v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/cache (restore/save) v6.1.0 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
#   actions/upload-artifact    v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact  v8.0.2  9000827ccba6bdab643e8b6fd33ac0654aef8333
# Rust comes from the runner's preinstalled rustup; the GitHub Release is created with `gh`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            exit 1
          fi

  commits:
    name: PR commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $re ]]; then
              echo "::error::Not a Conventional Commit: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$bad"
