name: Conventional Commits
# Pinned actions:
#   actions/checkout                       v7.0.1   3d3c42e5aac5ba805825da76410c181273ba90b1
#   amannn/action-semantic-pull-request    v6.1.1   48f256284bd46cdaab1048c3721360e808335d50

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false

  commits:
    name: PR commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $re ]]; then
              echo "::error::Not a Conventional Commit: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$bad"
