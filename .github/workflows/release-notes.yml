name: Edit release notes
# Replace a published release's notes with docs/releases/<tag>.md (manual only).
# Pinned actions: official GitHub `actions/*` only.
#   actions/checkout  v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag: $TAG"; exit 1; }
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "::error::missing $notes"; exit 1; }
          gh release edit "$TAG" --notes-file "$notes"
