version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /crates/ruckcode-app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-app:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      npm:
        patterns: ["*"]
