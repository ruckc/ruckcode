[package]
name = "ruckcode-sandbox"
description = "In-process command sandbox (namespaces, Landlock, seccomp, Seatbelt) and allowlist proxy for ruckcode"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Test/diagnostic entry point for the launcher; `rc` embeds the same launcher as `rc __sandbox-exec`.
name = "rc-sandbox-exec"
path = "src/bin/rc-sandbox-exec.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
tempfile.workspace = true
