ruck-harness-llm.workspace = true
ruck-harness-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
ruck-harness-ident = { workspace = true, features = ["testing"] }
tempfile.workspace = true
