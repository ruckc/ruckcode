[package]
name = "ruckcode-cli"
description = "`rc`: terminal UI and headless ACP client for ruckcode"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
futures.workspace = true
ratatui.workspace = true
reqwest.workspace = true
ruckcode-acp.workspace = true
ruckcode-core.workspace = true
ruckcode-llm.workspace = true
ruckcode-mcp.workspace = true
ruckcode-mise.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
tracing-subscriber.workspace = true
minisign-verify = "0.3"
semver = "1"
sha2 = "0.11"
base64 = "0.23"
flate2 = "1"
tar = "0.4"
self-replace = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
minisign = "0.10"
tempfile.workspace = true
